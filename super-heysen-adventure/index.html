  <script>
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),T=48,PLAYER_W=42,PLAYER_H=54,GRAVITY=.68,SPEED=4.4,JUMP=-12.5,LEVEL_TILES=360;

    let W,H,groundY,worldW,cameraX=0,started=false,won=false,lives=3,soundOn=true,seed=8911,platforms=[],enemies=[],goal;const keys={};const player={x:80,y:100,w:PLAYER_W,h:PLAYER_H,vx:0,vy:0,onGround:false,facing:true,crouch:false,walk:0,tick:0,inv:0};const audio={bgm:$('#bgm'),jump:$('#jump'),death:$('#death')};audio.bgm.volume=.32;audio.jump.volume=.42;audio.death.volume=.55;
    function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;groundY=Math.floor((H-42)/T)*T-T;worldW=LEVEL_TILES*T;if(!platforms.length)generateLevel()}addEventListener('resize',resize);
    function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function addBlock(x,row,type){platforms.push({x:x*T,y:row*T,w:T,h:T,type})}

    function showPanel(title,message,button){$('#startPanel h1').textContent=title;$('#startPanel p').firstChild.textContent=message;$('#play').textContent=button;$('#startPanel').style.display='block'}
    addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reset();if(started&&(e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp')&&player.onGround){player.vy=JUMP;player.onGround=false;play(audio.jump)}});addEventListener('keyup',e=>keys[e.code]=false);$('#play').onclick=reset;$('#start').onclick=()=>{started=false;audio.bgm.pause();showPanel('🏃 Super Heysen Adventure','Un nivel largo, continuo y con un final.','▶ Jugar')};$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊':'🔇';if(!soundOn)audio.bgm.pause();else if(started)playBgm()};
    function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function collideX(o){for(const p of platforms)if(hit(o,p)){if(o.vx>0)o.x=p.x-o.w;else if(o.vx<0)o.x=p.x+p.w;o.vx=0}}
    function collideY(o){o.onGround=false;for(const p of platforms)if(hit(o,p)){if(o.vy>=0){o.y=p.y-o.h;o.vy=0;o.onGround=true}else{o.y=p.y+p.h;o.vy=0}}}
    function update(){if(!started)return;player.crouch=(keys.KeyS||keys.ArrowDown)&&player.onGround;player.vx=0;if(!player.crouch){if(keys.KeyA||keys.ArrowLeft){player.vx=-SPEED;player.facing=false}if(keys.KeyD||keys.ArrowRight){player.vx=SPEED;player.facing=true}}player.x+=player.vx;collideX(player);player.x=Math.max(0,Math.min(worldW-player.w,player.x));player.vy+=GRAVITY;player.y+=player.vy;collideY(player);if(player.y>H+120){hurt();return}if(player.inv)player.inv--;for(const e of enemies){if(e.dead)continue;e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;e.vy+=GRAVITY;e.y+=e.vy;collideY(e);if(hit(player,e)){if(player.vy>1&&player.y+player.h-player.vy<e.y+18){e.dead=true;player.vy=JUMP*.55}else hurt()}}if(goal&&hit(player,goal)){won=true;started=false;audio.bgm.pause();showPanel('🏆 ¡Nivel completado!','Llegaste a la bandera final.','Jugar de nuevo')}cameraX=Math.max(0,Math.min(worldW-W,player.x-W*.42));player.tick++;if(Math.abs(player.vx)>0&&player.onGround&&player.tick%7===0)player.walk=1-player.walk}
    function image(img,x,y,w,h){if(img.complete&&img.naturalWidth)ctx.drawImage(img,x,y,w,h);else{ctx.fillStyle='#596e7c';ctx.fillRect(x,y,w,h)}}function drawBg(){if(tex.bg.complete&&tex.bg.naturalWidth){const ratio=tex.bg.naturalWidth/tex.bg.naturalHeight,dh=H-42,dw=dh*ratio,offset=-(cameraX*.14%dw);for(let x=offset;x<W;x+=dw)ctx.drawImage(tex.bg,x,0,dw,dh)}else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7bd1f3');g.addColorStop(1,'#d9f7ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}
    function draw(){drawBg();ctx.save();ctx.translate(-cameraX,0);for(const p of platforms){const im=p.type==='grass'?tex.grass:p.type==='dirt'?tex.dirt:tex.rock;image(im,p.x,p.y,p.w,p.h)}for(const e of enemies)if(!e.dead)image(tex.enemy,e.x,e.y,e.w,e.h);if(goal){ctx.fillStyle='#f7f7f7';ctx.fillRect(goal.x+21,goal.y,4,96);ctx.fillStyle='#e43a35';ctx.beginPath();ctx.moveTo(goal.x+25,goal.y);ctx.lineTo(goal.x+72,goal.y+14);ctx.lineTo(goal.x+25,goal.y+30);ctx.fill()}let s=!player.onGround?(player.vy<0?sprites.jump:sprites.fall):player.crouch?sprites.crouch:Math.abs(player.vx)>0?(player.walk?sprites.walk2:sprites.walk1):sprites.idle;ctx.save();if(!player.facing){ctx.translate(player.x+player.w,player.y);ctx.scale(-1,1);image(s,0,0,player.w,player.h)}else image(s,player.x,player.y,player.w,player.h);ctx.restore();ctx.restore();$('#lives').textContent='V
