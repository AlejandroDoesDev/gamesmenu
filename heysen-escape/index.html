    function updateGame(){if(!gameRunning)return;const sp=ducking?gameSpeed*.45:gameSpeed;bgX-=sp;if(bgX<=-innerWidth)bgX=0;background.style.left=bgX+'px';if(keys.up&&!jumping){jumping=true;velocityY=15;play(jumpSound,.88+Math.random()*.25,.8)}if(keys.down&&!jumping){ducking=true;player.classList.add('crouching');player.style.height='60px';chaserOffset=Math.max(135,chaserOffset-1.5)}else{ducking=false;player.classList.remove('crouching');player.style.height='100px';chaserOffset=Math.min(250,chaserOffset+.35)}if(jumping){playerY+=velocityY;velocityY-=.8;if(playerY<=0){playerY=velocityY=0;jumping=false}}player.style.bottom=120+playerY+'px';updateChaser();if(chaserOffset<=135)endGame(true)}function updateChaser(){chaser.style.marginLeft='-'+chaserOffset+'px'}
    function createObstacle(){if(!gameRunning)return;const el=document.createElement('div'),r=Math.random();let b=false;el.className='obstacle';el.style.left=innerWidth+'px';if(r<.3){el.style.cssText+='width:120px;height:70px'}else if(r<.55){el.style.cssText+='width:140px;height:90px'}else if(r<.78){b=true;el.classList.add('blue');el.style.cssText+='width:115px;height:155px'}else el.style.cssText+='width:90px;height:120px';el.style.bottom='120px';gameContainer.appendChild(el);const o={el,timer:null};obstacles.push(o);o.timer=setInterval(()=>{if(!gameRunning)return clearInterval(o.timer);const x=parseFloat(el.style.left)-gameSpeed;el.style.left=x+'px';if(!(b&&ducking)&&collidesThin(player,el))endGame(true);if(x<-180){clearInterval(o.timer);el.remove();obstacles=obstacles.filter(i=>i!==o)}},20)}function collidesThin(a,b){const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),i=br.width*.32;return!(ar.right-10<br.left+i||ar.left+10>br.right-i||ar.bottom-8<br.top+10||ar.top+8>br.bottom-10)}
    async function endGame(save=true){if(!gameRunning)return;gameRunning=false;[obstacleTimer,gameTimer,scoreTimer,jobSoundTimer].forEach(clearInterval);obstacles.forEach(o=>clearInterval(o.timer));stop(gameMusic);if(save&&username&&userData){if(!isLocalMode){try{await callScript('updateScore',{username,score});userData.total+=score;userData.best=Math.max(userData.best,score);userData.games++;localStorage.setItem('heysenSessionData',JSON.stringify(userData))}catch{}}else if(score>localBestScore){localBestScore=score;localStorage.setItem('heysenLocalBest',localBestScore);userData.best=userData.total=localBestScore}currentUser.textContent=isLocalMode?'🎮 Local · Mejor: '+userData.total:'👤 '+username+' · '+userData.total;$('finalScore').textContent=score;$('totalScore').textContent=userData.total;play(deathSounds[Math.floor(Math.random()*deathSounds.length)],.65+Math.random(),.9);gameOverScreen.style.display='block';playMenuMusic()}}
    async function openBoard(){leaderboardList.innerHTML='<li>Cargando…</li>';leaderboard.style.display='block';try{const r=await callScript('leaderboard');leaderboardList.innerHTML='';if(!r.users?.length)leaderboardList.innerHTML='<li class="empty">Sin jugadores.</li>';else r.users.slice(0,20).forEach(u=>{const li=document.createElement('li');li.textContent=u.username+' — '+u.total+' pts';leaderboardList.appendChild(li)})}catch(e){leaderboardList.textContent='Error: '+e.message}}
    $('logoutBtn').onclick=()=>{endGame(false);username='';userData=null;isLocalMode=false;localStorage.removeItem('heysenSession');userBar.style.display='none';hidePanels();authScreen.style.display='block';playMenuMusic()};$('restartBtn').onclick=()=>{gameOverScreen.style.display='none';startGame()};$('leaderboardBtn').onclick=openBoard;document.querySelector('.openBoard').onclick=openBoard;$('closeBoard').onclick=()=>leaderboard.style.display='none';$('startOrb').onclick=()=>{hidePanels();authScreen.style.display='block';beep(660,.12,'triangle',.04)};
    if(username){try{userData=JSON.parse(localStorage.getItem('heysenSessionData'))}catch{}currentUser.textContent='👤 '+username+' · '+(userData?.total||0);userBar.style.display='flex'}updateSound();
  </script>
