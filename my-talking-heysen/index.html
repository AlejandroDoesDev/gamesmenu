<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Talking Heysen</title>
<style>
:root{--blue:#46b9ef;--pink:#ef6093;--ink:#183951}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 0,#c0f2ff,#74c4ed 44%,#2877b4);font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}body:before{content:"";position:fixed;inset:0;opacity:.16;background:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 34px);pointer-events:none}.app{position:relative;width:min(950px,94vw);height:min(690px,92vh);display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden;border:4px solid #fff;border-radius:26px;background:#e8faff;box-shadow:0 22px 65px rgba(4,30,65,.45),inset 0 0 0 2px #3188bd}.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(#bdeeff 0 65%,#a8e374 65% 67%,#65b94e 67%)}.stage:before{content:"";position:absolute;width:330px;height:150px;top:16%;left:-65px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:330px 55px rgba(255,255,255,.5),190px 118px rgba(255,255,255,.35)}.brand{position:absolute;z-index:2;top:18px;left:20px;color:#fff;font-size:clamp(1.4rem,3vw,2rem);font-weight:900;letter-spacing:-.06em;text-shadow:0 3px #1473a7,0 5px 10px #2677a855}.brand em{color:#ffe35e;font-style:normal}.heysen{position:relative;z-index:1;width:min(58%,265px);height:315px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 15px 9px #0f442959);transform-origin:bottom;animation:breathe 2.5s ease-in-out infinite}.heysen.talking{animation:talk .16s infinite}.heysen.happy{animation:happy .55s ease-in-out 3}.bubble{position:absolute;z-index:3;right:18px;top:95px;max-width:225px;padding:11px 14px;border:2px solid #fff;border-radius:15px 15px 4px 15px;background:#fffffff0;font-size:14px;font-weight:700;box-shadow:0 5px 13px #08446828}.meter{position:absolute;z-index:3;bottom:20px;left:20px;right:20px;padding:7px 10px;color:#fff;border:2px solid #ffffffcc;border-radius:12px;background:#0c5f6775;font-size:11px;font-weight:800;text-shadow:0 1px #145}.meter i{display:block;height:7px;margin-top:4px;border-radius:9px;background:linear-gradient(90deg,#ffe668 72%,#ffffff4d 72%)}.panel{display:flex;min-width:0;flex-direction:column;padding:22px;background:linear-gradient(160deg,#fffdf4,#e6f9ff)}.top{display:flex;justify-content:space-between;margin-bottom:13px;color:#1a638d;font-weight:900}.top b{padding:4px 8px;color:#fff;border-radius:8px;background:var(--pink);font-size:11px;letter-spacing:.05em}.modes{display:flex;gap:8px;margin-bottom:12px}.mode{flex:1;padding:9px;border:2px solid #bddbed;border-radius:11px;color:#47718b;background:#fff;font-weight:800;cursor:pointer}.mode.active{color:#fff;border-color:#1c9bd5;background:linear-gradient(#62ccfa,#228eca);box-shadow:inset 0 2px #ffffff70}.chat{flex:1;min-height:0;overflow:auto;padding:4px 2px 12px}.msg{max-width:89%;margin:8px 0;padding:9px 11px;border-radius:13px;font-size:14px;line-height:1.35}.bot{border:1px solid #bedfeb;border-radius:13px 13px 13px 3px;background:#fff}.you{margin-left:auto;color:#fff;border-radius:13px 13px 3px 13px;background:linear-gradient(135deg,#42b9ed,#1886c5)}form{display:flex;gap:8px;padding-top:11px;border-top:1px solid #cde5ef}input{min-width:0;flex:1;padding:10px 11px;border:2px solid #bbdbea;border-radius:11px;font:14px "Segoe UI";outline:none}input:focus{border-color:#39aee8}.send{padding:0 14px;color:#fff;border:0;border-radius:11px;background:linear-gradient(#65ccfb,#238eca);font-weight:900;cursor:pointer}.voice{display:none;flex:1;place-content:center;text-align:center}.voice.active{display:grid}.mic{width:106px;height:106px;margin:auto;color:#fff;border:5px solid #d7f6ff;border-radius:50%;background:radial-gradient(circle at 36% 25%,#ffb3cb,#ef6395 62%,#c33268);box-shadow:0 8px 0 #a72556,0 13px 24px #a81f4f40;font-size:38px;cursor:pointer}.mic.listening{animation:pulse 1s infinite;background:radial-gradient(circle,#ffe18f,#ff9e44 62%,#e26722)}.voice h2{margin:20px 0 4px;color:#275c79;font-size:1.15rem}.voice p{max-width:270px;margin:0;color:#69879a;font-size:13px}.note{margin-top:18px!important;font-size:12px!important}@keyframes breathe{50%{transform:scale(1.025,.985) translateY(3px)}}@keyframes talk{50%{transform:scaleY(.97) rotate(-1deg)}}@keyframes happy{25%{transform:translateY(-17px) rotate(-6deg)}75%{transform:translateY(-8px) rotate(6deg)}}@keyframes pulse{50%{box-shadow:0 8px 0 #e26722,0 0 0 17px #ff9c3d40}}@media(max-width:700px){.app{width:100vw;height:100vh;grid-template-columns:1fr;grid-template-rows:47% 53%;border:0;border-radius:0}.panel{padding:15px}.heysen{height:230px}.bubble{top:64px}.meter{bottom:10px}.brand{top:10px}.chat{min-height:110px}}
</style></head><body>
<main class="app"><section class="stage"><div class="brand">My Talking <em>Heysen</em></div><div id="bubble" class="bubble">¡Heysen está listo!</div><img id="heysen" class="heysen" src="./assets/images/HeysenIdle.png" alt="Heysen"><div class="meter">FELIZ Y CON ENERGÍA<i id="bar"></i></div></section><section class="panel"><div class="top">HABLA CON HEYSEN <b>PARODIA</b></div><div class="modes"><button class="mode active" data-mode="chat">⌨️ Chat</button><button class="mode" data-mode="voice">🎙️ Voice chat</button></div><div id="chat" class="chat"><div class="msg bot">Heysen solo puede decir: Sí, No, reírse o hacer “ugh”.</div></div><div id="voice" class="voice"><button id="mic" class="mic" aria-label="Hablar">🎙️</button><h2 id="voiceTitle">Toca el micrófono para hablar</h2><p id="voiceText">Heysen responderá solo con sus sonidos.</p><p class="note">Requiere Chrome o Edge con permiso de micrófono.</p></div><form id="form"><input id="input" autocomplete="off" placeholder="Escribe algo a Heysen…"><button class="send">Enviar</button></form></section></main>
<audio id="yes" preload="none" src="https://www.myinstants.com/media/sounds/talking-benn-yes.mp3"></audio><audio id="no" preload="none" src="https://www.myinstants.com/media/sounds/talking-bennnn-noo.mp3"></audio><audio id="laugh" preload="none" src="https://www.myinstants.com/media/sounds/talkingg-benn-laughh.mp3"></audio><audio id="ugh" preload="none" src="https://www.myinstants.com/media/sounds/talking-benn-ughhh.mp3"></audio><audio id="stupid" preload="none" src="https://www.myinstants.com/media/sounds/ustoopid.mp3"></audio><audio id="crash" preload="none" src="https://www.myinstants.com/media/sounds/helicopter-crash.mp3"></audio>
<script>
const $=s=>document.querySelector(s),chat=$('#chat'),bubble=$('#bubble'),heysen=$('#heysen'),input=$('#input'),form=$('#form'),voice=$('#voice'),mic=$('#mic'),vt=$('#voiceTitle'),vx=$('#voiceText'),sounds={yes:$('#yes'),no:$('#no'),laugh:$('#laugh'),ugh:$('#ugh'),stupid:$('#stupid'),crash:$('#crash')};let rec,listening=false;
function playSound(key){const a=sounds[key];if(!a)return;a.pause();a.currentTime=0;a.play().catch(()=>{});heysen.classList.add('talking');a.onended=()=>heysen.classList.remove('talking')}
function isOliverTrigger(t){const compact=t.toLowerCase().replace(/[^a-záéíóúñ]/g,'');return /onin(?:onin|on)*/.test(compact)}
function reaction(text){const t=text.toLowerCase();if(isOliverTrigger(t))return{label:'*Sonidos de helicoptero*',sound:'crash'};if(/stupid|tonto|tonta|idiota/.test(t))return{label:'You stupid',sound:'stupid'};if(/nunca|odio|feo|mal|ugh|asco/.test(t))return{label:'Ugh',sound:'ugh'};if(/jaja|jeje|risa|chiste|gracioso|lol/.test(t))return{label:'Jojojo',sound:'laugh'};if(/\bno\b|es falso|verdad\?/.test(t))return{label:'No',sound:'no'};return Math.random()<.5?{label:'Si',sound:'yes'}:{label:'No',sound:'no'}}
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight}function reply(t){if(!t.trim())return;add(t,'you');setTimeout(()=>{const r=reaction(t);add(r.label,'bot');bubble.textContent=r.label;heysen.classList.add('happy');setTimeout(()=>heysen.classList.remove('happy'),1200);playSound(r.sound)},260)}form.onsubmit=e=>{e.preventDefault();reply(input.value);input.value=''};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{let on=b.dataset.mode==='voice';document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));voice.classList.toggle('active',on);chat.style.display=on?'none':'block';form.style.display=on?'none':'flex';if(on)setup();else rec&&rec.stop()});
function setup(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){vt.textContent='El modo voz no está disponible';vx.textContent='Usa el modo chat o abre el juego en Chrome o Edge.';mic.disabled=true;return}if(rec)return;rec=new R();rec.lang='es-ES';rec.interimResults=true;rec.onstart=()=>{listening=true;mic.classList.add('listening');vt.textContent='Heysen te está escuchando…';vx.textContent='Habla ahora.'};rec.onresult=e=>{let t=[...e.results].map(r=>r[0].transcript).join('');vx.textContent='“'+t+'”';if(e.results[e.results.length-1].isFinal){rec.stop();const r=reaction(t);add(t,'you');add(r.label,'bot');bubble.textContent=r.label;playSound(r.sound);vt.textContent='Heysen reaccionó';vx.textContent=r.label}};rec.onerror=e=>{vt.textContent='No pude escucharte';vx.textContent=e.error==='not-allowed'?'Permite el uso del micrófono y prueba de nuevo.':'Inténtalo otra vez.'};rec.onend=()=>{listening=false;mic.classList.remove('listening')}}mic.onclick=()=>{setup();if(rec)listening?rec.stop():rec.start()};
</script></body></html>
